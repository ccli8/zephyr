description: Nuvoton NuMaker System Clock Controller (SCC)

compatible: "nuvoton,numaker-scc"

include: [clock-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  hxt:
    type: string
    description: |
      Enable/disable 4~24 MHz external crystal oscillator (HXT)
    enum:
      - "untouched"
      - "enable"
      - "disable"

  lxt:
    type: string
    description: |
      Enable/disable 32.768 kHz low-speed external crystal oscillator (LXT)
    enum:
      - "untouched"
      - "enable"
      - "disable"

  hirc48:
    type: string
    description: |
      Enable/disable 48 MHz high-speed internal RC oscillator (HIRC48)
    enum:
      - "untouched"
      - "enable"
      - "disable"

  clk-pclkdiv:
    type: int
    description: |
      Configure APB Clock Divider register

  core-clock:
    type: int
    description: |
      Configure core clock (HCLK)

  pll-clock-source:
    type: int
    description: |
      Configure PLL clock source. Same as u32PllFreq parameter on invoking
      BSP CLK driver CLK_EnablePLL().

  pll-target-frequency:
    type: int
    description: |
      Configure PLL target frequency. Same as u32PllFreq parameter on invoking
      BSP CLK driver CLK_EnablePLL().

  hclk-clock-source:
    type: int
    description: |
      Configure HCLK clock source. Same as u32ClkSrc parameter on invoking
      BSP CLK driver CLK_SetHCLK().

  hclk-clock-divider:
    type: int
    description: |
      Configure HCLK clock divider. Same as u32ClkDiv parameter on invoking
      BSP CLK driver CLK_SetHCLK().
